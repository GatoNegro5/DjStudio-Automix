name: Build and Release CI

on:
  push:
    tags:
      - 'v*' # El pipeline solo se disparará cuando envíes un tag (ej. v1.0.0)

jobs:
  build:
    name: Build Artifacts
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: apk
            build_cmd: flutter build apk --release
            asset_name: app-release.apk
            rust_targets: aarch64-linux-android, x86_64-linux-android, armv7-linux-androideabi
          - os: windows-latest
            target: windows
            build_cmd: flutter build windows --release
            asset_name: DjStudio-Windows.zip
            rust_targets: x86_64-pc-windows-msvc
          - os: macos-latest
            target: macos
            build_cmd: flutter build macos --release
            asset_name: DjStudio-MacOS.zip
            rust_targets: x86_64-apple-darwin, aarch64-apple-darwin

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java (Android)
        if: matrix.target == 'apk'
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      # 🛠️ INYECCIÓN 1: Instalar Rust y los Targets Nativos por OS
      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      # 🛠️ INYECCIÓN 1.5: Caché Global de Rust (Evita recompilar crates nativos en cada push)
      - name: Cache Rust Dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "djstudio-rust-${{ matrix.os }}"

      # 🛠️ INYECCIÓN 2: Descarga Binaria Precompilada (0 minutos de delay)
      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@main

      - name: Install Flutter Rust Bridge Codegen Fast
        run: cargo binstall flutter_rust_bridge_codegen@2.12.0 --no-confirm

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install Dependencies
        run: flutter pub get

      # 🛠️ INYECCIÓN 3: Generar Memoria FFI (Evita el Linker Error en iOS/Mac/Android)
      - name: Generate FFI Bindings
        run: flutter_rust_bridge_codegen generate

      # 🛠️ INYECCIÓN 4: Purgar y enlazar CocoaPods en MacOS antes de compilar
      - name: Clean & Setup CocoaPods (MacOS Only)
        if: matrix.target == 'macos'
        run: |
          cd macos
          rm -rf Pods
          rm -f Podfile.lock
          pod repo update
          pod install
          cd ..

      - name: Setup Android NDK
        if: matrix.target == 'apk'
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r25c # Versión de producción más estable para Flutter/Rust
          add-to-path: false

      - name: Build Platform
        shell: bash
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          ${{ matrix.build_cmd }}

      - name: Compile Windows Installer
        if: matrix.target == 'windows'
        run: |
          "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" windows_setup.iss
        shell: cmd

      - name: Zip MacOS Build
        if: matrix.target == 'macos'
        run: ditto -c -k --sequesterRsrc --keepParent build/macos/Build/Products/Release/*.app DjStudio-MacOS.zip

      - name: Upload Artifacts to Job
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: |
            ${{ matrix.target == 'apk' && 'build/app/outputs/flutter-apk/app-release.apk' || '' }}
            ${{ matrix.target == 'windows' && 'DjStudio-Installer.exe' || '' }}
            ${{ matrix.target == 'macos' && 'DjStudio-MacOS.zip' || '' }}

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/
          merge-multiple: true

      - name: Deploy to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/app-release.apk
            artifacts/DjStudio-Installer.exe
            artifacts/DjStudio-MacOS.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  djiphone:
    name: Build DjIphone IPA
    needs: release
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Cache Rust Dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: djstudio-rust-ios-ipa

      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@main

      - name: Install Flutter Rust Bridge Codegen Fast
        run: cargo binstall flutter_rust_bridge_codegen@2.12.0 --no-confirm

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install Dependencies
        run: flutter pub get

      - name: Generate FFI Bindings
        run: flutter_rust_bridge_codegen generate

      # CocoaPods dispara el script de Cargokit (librería Rust). El proyecto
      # Swift Package Manager no lo hace. Solo en este job.
      - name: Regenerate iOS project with CocoaPods
        run: |
          cp ios/Runner/Info.plist "$RUNNER_TEMP/DjIphone-Info.plist"
          flutter config --no-enable-swift-package-manager
          flutter create --platforms=ios --org com.djstudio .
          cp "$RUNNER_TEMP/DjIphone-Info.plist" ios/Runner/Info.plist
          perl -pi -e 's/PRODUCT_BUNDLE_IDENTIFIER = com\.djstudio\.djstudioPlayer;/PRODUCT_BUNDLE_IDENTIFIER = com.djstudio.djiphone;/g' ios/Runner.xcodeproj/project.pbxproj
          perl -pi -e 's/IPHONEOS_DEPLOYMENT_TARGET = 13\.0;/IPHONEOS_DEPLOYMENT_TARGET = 15.0;/g' ios/Runner.xcodeproj/project.pbxproj
          cd ios
          perl -pi -e "s/^# (platform :ios, '[0-9.]+')/\$1/" Podfile
          grep -q "^platform :ios," Podfile || printf "\nplatform :ios, '15.0'\n" >> Podfile
          pod repo update
          pod install
          cd ..

      - name: Build unsigned iOS app
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          flutter build ios --release --no-codesign -t lib/djiphone/main.dart

      - name: Pack DjIphone.ipa
        run: |
          APP=$(find build/ios/iphoneos -maxdepth 1 -name '*.app' -print -quit)
          test -n "$APP"
          rm -rf Payload
          mkdir Payload
          cp -R "$APP" Payload/
          zip -qr DjIphone.ipa Payload
          rm -rf Payload

      - name: Publish DjIphone.ipa
        uses: softprops/action-gh-release@v2
        with:
          files: DjIphone.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}