name: Build and Release CI

on:
  push:
    tags:
      - 'v*' # El pipeline solo se disparará cuando envíes un tag (ej. v1.0.0)

jobs:
  build:
    name: Build Artifacts
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: apk
            build_cmd: flutter build apk --release
            asset_name: app-release.apk
            rust_targets: aarch64-linux-android, x86_64-linux-android, armv7-linux-androideabi
          - os: windows-latest
            target: windows
            build_cmd: flutter build windows --release
            asset_name: DjStudio-Windows.zip
            rust_targets: x86_64-pc-windows-msvc
          - os: macos-latest
            target: macos
            build_cmd: flutter build macos --release
            asset_name: DjStudio-MacOS.zip
            rust_targets: x86_64-apple-darwin, aarch64-apple-darwin

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java (Android)
        if: matrix.target == 'apk'
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      # 🛠️ INYECCIÓN 1: Instalar Rust y los Targets Nativos por OS
      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      # 🛠️ INYECCIÓN 2: Instalar el Puente Generador FFI en la Máquina Virtual
      - name: Install Flutter Rust Bridge Codegen
        run: cargo install flutter_rust_bridge_codegen --version "=2.12.0"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install Dependencies
        run: flutter pub get

      # 🛠️ INYECCIÓN 3: Generar Memoria FFI (Evita el Linker Error en iOS/Mac/Android)
      - name: Generate FFI Bindings
        run: flutter_rust_bridge_codegen generate

      # 🛠️ INYECCIÓN 4: Purgar y enlazar CocoaPods en MacOS antes de compilar
      - name: Clean & Setup CocoaPods (MacOS Only)
        if: matrix.target == 'macos'
        run: |
          cd macos
          rm -rf Pods
          rm -f Podfile.lock
          pod repo update
          pod install
          cd ..

      - name: Build Platform
        run: ${{ matrix.build_cmd }}

      - name: Compile Windows Installer
        if: matrix.target == 'windows'
        run: |
          "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" windows_setup.iss
        shell: cmd

      - name: Zip MacOS Build
        if: matrix.target == 'macos'
        run: ditto -c -k --sequesterRsrc --keepParent build/macos/Build/Products/Release/*.app DjStudio-MacOS.zip

      - name: Upload Artifacts to Job
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: |
            ${{ matrix.target == 'apk' && 'build/app/outputs/flutter-apk/app-release.apk' || '' }}
            ${{ matrix.target == 'windows' && 'DjStudio-Installer.exe' || '' }}
            ${{ matrix.target == 'macos' && 'DjStudio-MacOS.zip' || '' }}

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/
          merge-multiple: true

      - name: Deploy to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/app-release.apk
            artifacts/DjStudio-Installer.exe
            artifacts/DjStudio-MacOS.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}